<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="frame.css"><link rel="stylesheet" href="anim.css"><script src="anim.js"></script>
<title>Venezuela · day by day to Week 10</title>
<style>
  .map{position:absolute; left:330px; top:0}
  .ve-tag{position:absolute; left:360px; top:64px; font-family:var(--mono); font-size:22px;
    letter-spacing:0.42em; color:var(--muted)}
  .wk{position:absolute; left:360px; top:106px; font-family:var(--mono); font-size:58px;
    color:var(--gold-hi); letter-spacing:0.06em; font-variant-numeric:tabular-nums}
  .wk small{font-size:26px; color:var(--muted); letter-spacing:0.2em; margin-left:16px}
  .stats{position:absolute; right:130px; top:150px; width:430px; font-family:var(--mono)}
  .stat{display:flex; justify-content:space-between; align-items:baseline;
    border-bottom:1px solid var(--line-soft); padding:16px 4px}
  .stat .l{font-size:16px; letter-spacing:0.22em; color:var(--muted)}
  .stat .v{font-size:29px; color:var(--ivory); font-variant-numeric:tabular-nums}
  .stat .v.gold{color:var(--gold-hi)}
  .stat .v.warn{color:#d98a8a}
  .chyron{position:absolute; left:0; right:0; bottom:0; z-index:50; background:rgba(7,11,20,0.95);
    border-top:3px solid var(--crimson); padding:20px 56px 0}
  .chyron .plate{display:inline-block; background:var(--crimson); color:var(--ivory);
    font-family:var(--mono); font-size:14px; letter-spacing:0.3em; padding:6px 14px; margin-bottom:12px}
  .chyron h2{font-family:var(--display); font-weight:400; font-size:40px; color:var(--ivory); margin:0 0 14px; letter-spacing:0.03em}
  .tickerbar{margin:0 -56px; border-top:1px solid var(--line-soft); background:#060a13;
    overflow:hidden; white-space:nowrap; padding:12px 0 14px}
  .tk{display:inline-block; font-family:var(--mono); font-size:17px; letter-spacing:0.14em;
    color:#c8933f; white-space:nowrap; will-change:transform}
  .tk b{color:var(--ivory); font-weight:normal}

  .bcast{position:absolute; left:56px; right:56px; bottom:16px; z-index:50;
    font-family:'Liberation Sans','DejaVu Sans',sans-serif}
  .tabs{display:flex; padding-left:8px}
  .btab{font-weight:bold; font-size:20px; letter-spacing:0.03em; padding:9px 20px 7px;
    border-radius:7px 7px 0 0; color:#fff; text-transform:uppercase}
  .btab.red{background:#c0322e}
  .btab.dark{background:#23262e; color:#e9e9e9}
  .band{background:#f4f2ec; border-radius:5px; display:flex; align-items:center; height:74px;
    padding:0 20px; box-shadow:0 8px 30px rgba(0,0,0,0.55)}
  .bhl{flex:1; color:#101010; font-weight:bold; white-space:nowrap; letter-spacing:-0.01em;
    transform:scaleX(0.94); transform-origin:left center}
  .bmark{text-align:center; padding-left:16px}
  .bmark b{display:block; color:#c0322e; font-size:33px; font-weight:900; font-style:italic;
    letter-spacing:-0.02em; line-height:1}
  .bmark i{display:block; color:#c0322e; font-size:12px; letter-spacing:0.4em; font-style:normal;
    font-weight:bold; margin-top:2px; border-top:2.5px solid #c0322e; padding-top:2px}
  .bstrip{display:flex; align-items:center; background:#14161c; border-radius:0 0 5px 5px;
    height:42px; margin-top:3px}
  .bts{color:#fff; font-weight:bold; font-size:19px; padding:0 18px; white-space:nowrap}
  .bchev{color:#9aa0ab; padding-right:12px; font-size:21px; font-weight:bold}
  .bwin{flex:1; overflow:hidden; white-space:nowrap; margin-right:18px}
  .btk{display:inline-block; font-family:'Liberation Sans','DejaVu Sans',sans-serif; font-size:20px;
    color:#d6dae2; white-space:nowrap; will-change:transform}
  .btk b{color:#fff}
</style>
<div class="stage">
  <div class="map"><svg id="ve" width="900" height="815" viewBox="0 0 640 579"></svg></div>
  <div class="ve-tag">OPERATION SOUTHERN SHIELD · TIMELAPSE</div>
  <div class="wk"><span id="wkn">WEEK 1</span><small id="dayn">DAY 1</small></div>
  <div class="stats" id="stats"></div>
  <div class="bcast">
    <div class="tabs"><span class="btab red" >Live</span><span class="btab dark" id=id2>Wire · Caracas</span></div>
    <div class="band"><span class="bhl" id="headline" style="font-size:36px">US FORCES ADVANCE ACROSS VENEZUELA</span>
      <span class="bmark"><b>WIRE</b><i>LIVE</i></span></div>
    <div class="bstrip"><span class="bts" id="bts">DAY 1</span><span class="bchev">›</span>
      <div class="bwin"><div class="btk" id="tk"></div></div></div>
  </div>
  <div class="timecode" style="bottom:170px">TEASER 02 · WEEK 1 → WEEK 10</div>
  <div class="grade"></div>
</div>
<script src="data.js"></script>
<script>
(function(){
  var NS='http://www.w3.org/2000/svg';
  var svg=document.getElementById('ve');
  var GOV="#28406e", OCC="#8f3040", FRESH="#c9a961", LOST="#d98a8a", BGLN="#0a101f";
  var paths=VE_PATHS.map(function(d){
    var p=document.createElementNS(NS,'path');
    p.setAttribute('d',d); p.setAttribute('fill',GOV); p.setAttribute('stroke',BGLN); p.setAttribute('stroke-width',0.5);
    svg.appendChild(p); return p;
  });
  // Per-tile activation/deactivation DAY from the weekly ledger (weeks 1..10)
  var actDay={}, rmDay={};
  for(var w=1; w<=10; w++){
    var wk=VE.weeks[w-1], start=(w-1)*7+1;
    wk.add.forEach(function(idx,i){ if(!(idx in actDay)) actDay[idx]=start+(i/Math.max(1,wk.add.length))*6.5; });
    wk.rm.forEach(function(idx,i){ rmDay[idx]=start+(i/Math.max(1,wk.rm.length))*6.0; });
  }
  // cumulative weekly stats for interpolation (week 0 = zeros)
  var W=[{cas:0,kia:0,ref:3800,cost:0}].concat(VE.weeks.slice(0,10));
  function lerp(a,b,f){return a+(b-a)*f}
  var wkn=document.getElementById('wkn'), dayn=document.getElementById('dayn'),
      stats=document.getElementById('stats'),
      headline=document.getElementById('headline'),
      tk=document.getElementById('tk');
  var SEP='  \u203a  ';
  var TKTEXT=['Armed groups challenge democratic administration','IED attacks in three provinces',
    'Convoy ambushed outside Maracay','Regime elements in disarray','Curfew declared in Caracas',
    'Oil exports suspended'].join(SEP)+SEP;
  tk.textContent=TKTEXT+TKTEXT+TKTEXT;
  var TDUR=4.5, D0=0.25, D1=3.75;    // day 1 at D0, day 70 at D1, hold after
  window.__render=function(t){
    var day=1+69*Math.max(0,Math.min(1,(t-D0)/(D1-D0)));
    var w=Math.min(10,Math.floor((day-1)/7)+1), f=Math.min(1,(day-(w-1)*7-1)/7);
    var occCount=0;
    paths.forEach(function(p,i){
      var a=actDay[i], r=rmDay[i];
      var occ=(a!==undefined && day>=a) && !(r!==undefined && day>=r);
      var lost=(r!==undefined && day>=r);
      if(occ) occCount++;
      var fresh=occ && a!==undefined && (day-a)<3.2;
      var justLost=lost && (day-r)<4.5;
      p.setAttribute('fill', occ?OCC:(justLost?'#33456f':GOV));
      p.setAttribute('stroke', fresh?FRESH:(justLost?LOST:BGLN));
      p.setAttribute('stroke-width', (fresh||justLost)?1.6:0.5);
    });
    wkn.textContent='WEEK '+w; dayn.textContent='DAY '+Math.round(day);
    var s0=W[w-1], s1=W[w];
    var cas=Math.round(lerp(s0.cas,s1.cas,f)), kia=Math.round(lerp(s0.kia,s1.kia,f));
    var ref=Math.round(lerp(s0.ref,s1.ref,f)), cost=lerp(s0.cost||0,s1.cost,f);
    var rows=[
      ['TERRITORY SECURED', Math.round(occCount/270*100)+'%', 'gold'],
      ['CARACAS', day>=25?'ENCIRCLED':(day>=12?'UNDER ASSAULT':'HOLDING'), 'gold'],
      ['ENEMY CASUALTIES', cas.toLocaleString('en-US'), ''],
      ['US KIA', kia.toLocaleString('en-US'), day>=58?'warn':''],
      ['REFUGEES', Math.round(ref/1000)+'k', ''],
      ['COST', '$'+cost.toFixed(1)+'B', '']
    ];
    stats.innerHTML=rows.map(function(r){
      return '<div class="stat"><span class="l">'+r[0]+'</span><span class="v '+r[2]+'">'+r[1]+'</span></div>';
    }).join('');
    // chyron phases: advance -> puppet regime installed (wk4) -> insurgency (wk9-10)
    document.getElementById('bts').textContent='DAY '+Math.round(day);
    if(day<26){ headline.textContent='US FORCES ADVANCE ACROSS VENEZUELA'; headline.style.fontSize='36px'; }
    else if(day<58){ headline.textContent='US-BACKED GOVERNMENT INSTALLED IN CARACAS'; headline.style.fontSize='36px'; }
    else { headline.textContent='INSURGENCY ERUPTS AGAINST THE NEW GOVERNMENT'; headline.style.fontSize='36px'; }
    tk.style.transform='translateX('+(-t*210)+'px)';
  };
  window.__render(0);
})();
</script>
