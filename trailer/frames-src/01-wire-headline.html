<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="frame.css"><link rel="stylesheet" href="anim.css"><script src="anim.js"></script>
<title>0:00 — Wire headline</title>
<style>
  .wire-tag{
    position:absolute; left:56px; top:52px; display:flex; align-items:center; gap:18px;
    font-family:var(--mono); font-size:20px; letter-spacing:0.3em; color:var(--dim);
  }
  .wire-tag .dot{width:10px; height:10px; border-radius:50%; background:var(--crimson);
    box-shadow:0 0 12px rgba(176,74,74,0.8)}
  .headline{
    position:absolute; left:0; right:0; top:44%;
    text-align:center; font-family:var(--display); font-size:84px; letter-spacing:0.05em;
    color:var(--ivory); text-shadow:0 2px 30px rgba(4,7,14,0.9);
  }
  .headline .red{font-weight:bold}
  .headline .r{color:#a52a2a; text-shadow:0 0 30px rgba(165,42,42,0.4)}
  .headline .bl{color:#3f63c8; text-shadow:0 0 30px rgba(63,99,200,0.4)}
  .headline .typed{color:var(--gold)}
  .sub{
    position:absolute; left:0; right:0; top:calc(44% + 128px); text-align:center;
    font-family:var(--mono); font-size:19px; letter-spacing:0.28em; color:#4a5878;
  }
</style>
<div class="stage">
  
  <div class="headline">Election 2024&hellip; <span class="typed"><span class="red"><span class="r">A</span> <span class="bl">L</span><span class="r">a</span><span class="bl">n</span><span class="r">d</span><span class="bl">s</span><span class="r">l</span><span class="bl">i</span><span class="r">d</span><span class="bl">e</span> <span class="r">V</span><span class="bl">i</span><span class="r">c</span><span class="bl">t</span><span class="r">o</span><span class="bl">r</span><span class="r">y</span></span></span>&nbsp;<span class="cursor"></span></div>
  <div class="sub">NOVEMBER 5, 2024</div>
  <div class="disclaimer">PART AFTER THE ELLIPSIS TYPES IN · LANDSLIDE VICTORY ALTERNATES RED / BLUE PER LETTER</div>
  <div class="timecode">TEASER 02 · 0:08</div>
  <div class="grade"></div>
</div>
<script>
(function(){
  var letters=[].slice.call(document.querySelectorAll('.headline .red span'));
  var cur=document.querySelector('.headline .cursor');
  letters.forEach(function(l){ l.style.opacity=0; });
  window.__render=function(t){
    var p=Math.max(0,Math.min(1,(t-0.1)/0.85)); var k=Math.round(p*letters.length);
    letters.forEach(function(l,i){ l.style.opacity=(i<k)?1:0; });
    if(cur) cur.style.opacity=(t*2%1<0.55)?1:0.1;
  };
  window.__render(0);
})();
</script>
