<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="frame.css"><link rel="stylesheet" href="anim.css"><script src="anim.js"></script>
<title>Operation Steel Claw — typed, then redacted</title>
<style>
  body{background:#080c15}
  .lobby{position:absolute; inset:0;
    background:
      radial-gradient(ellipse 62% 46% at 30% 66%, rgba(38,52,84,0.35), transparent 70%),
      linear-gradient(180deg, #070b14 0%, #0a101d 52%, #10182a 78%, #0b1120 100%)}
  .lobby .floor{position:absolute; left:0; right:0; bottom:0; height:400px;
    background:linear-gradient(180deg, transparent, rgba(16,24,42,0.9));
    transform:perspective(900px) rotateX(38deg); transform-origin:bottom}
  .seal{position:absolute; left:24px; top:150px; width:820px; height:820px; opacity:0.8}
  .crosshair{position:absolute; right:220px; top:140px; width:280px; height:280px; opacity:0.5}
  .cable{position:absolute; left:330px; top:110px; width:1150px; padding:70px 90px;
    background:rgba(11,17,30,0.96); border:1px solid var(--line);
    box-shadow:0 50px 140px rgba(0,0,0,0.8); font-family:var(--mono)}
  .c-head{display:flex; justify-content:space-between; font-size:17px; letter-spacing:0.24em;
    color:var(--crimson); border-bottom:2px solid var(--crimson); padding-bottom:20px; margin-bottom:44px}
  .c-line{font-size:23px; line-height:2.5; color:#a9b0c2; letter-spacing:0.06em; min-height:420px}
  .rd{position:relative; display:inline-block; padding:0 6px; color:#c8b98a}
  .rd .mask{position:absolute; inset:-1px -2px; background:#03050a; border:1px solid #1a2742;
    transform:scaleX(0); transform-origin:left center}
  .caret{display:inline-block; width:13px; height:26px; background:var(--gold);
    vertical-align:-4px; margin-left:2px}
  .annot{position:absolute; right:400px; bottom:360px; border:4px solid var(--crimson);
    padding:16px 30px; font-size:30px; letter-spacing:0.22em; color:var(--crimson); transform:rotate(-6deg);
    font-family:var(--mono); background:rgba(11,18,32,0.35);
    text-shadow:0 0 26px rgba(176,74,74,0.5); box-shadow:0 0 50px rgba(176,74,74,0.25); z-index:60}
  .c-foot{margin-top:44px; font-size:15px; letter-spacing:0.2em; color:var(--dim)}

  .storycap{position:absolute; left:0; right:0; text-align:center; z-index:60;
    font-family:var(--display); font-weight:400; font-size:46px; letter-spacing:0.05em;
    color:#c9cfda; text-shadow:0 2px 24px rgba(4,7,14,0.95), 0 0 34px rgba(160,170,190,0.25)}
  .storycap .capcur{display:inline-block; width:5px; height:0.85em; background:var(--gold);
    vertical-align:-3px; margin-left:8px}
  .capshade{position:absolute; left:0; right:0; z-index:55; pointer-events:none;
    background:linear-gradient(to top, rgba(4,7,14,0.85), transparent)}
</style>
<div class="stage">
  <div class="lobby"><div class="floor"></div></div>
  <svg class="seal" viewBox="0 0 400 400">
    <defs><path id="ringpath" d="M200,58 a142,142 0 1,1 -0.1,0"/></defs>
    <circle cx="200" cy="200" r="184" fill="rgba(13,20,36,0.6)" stroke="#35477a" stroke-width="3"/>
    <circle cx="200" cy="200" r="152" fill="none" stroke="#35477a" stroke-width="2"/>
    <circle cx="200" cy="200" r="108" fill="rgba(10,16,30,0.8)" stroke="#3a4c80" stroke-width="2"/>
    <text font-family="Georgia, serif" font-size="21" letter-spacing="5" fill="#5468a0">
      <textPath href="#ringpath">CENTRAL INTELLIGENCE AGENCY · UNITED STATES OF AMERICA ·</textPath></text>
    <g stroke="#4a5e96" fill="#1a2848">
      <path d="M200 108 L216 176 L284 176 L229 214 L250 288 L200 240 L150 288 L171 214 L116 176 L184 176 Z"
        stroke-width="2.5"/>
    </g>
    <circle cx="200" cy="200" r="16" fill="#1a2742" stroke="#4a5e96" stroke-width="2"/>
  </svg>
  <svg class="crosshair" viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="42" fill="none" stroke="#243352" stroke-width="1"/>
    <circle cx="50" cy="50" r="24" fill="none" stroke="#243352" stroke-width="1"/>
    <line x1="50" y1="0" x2="50" y2="100" stroke="#243352" stroke-width="1"/>
    <line x1="0" y1="50" x2="100" y2="50" stroke="#243352" stroke-width="1"/>
  </svg>
  <div class="cable">
    <div class="c-head"><span id="h1"></span><span id="h2"></span></div>
    <div class="c-line" id="body"></div>
    <div class="c-foot" id="foot"></div>
  </div>
  <div class="annot" id="annot">AUTHORIZED · NOT SIGNED · EXECUTE</div>
  <div class="disclaimer">TYPES IN LIKE A TELEPRINTER · THEN THE REDACTIONS STRIKE THROUGH · STAMP LANDS</div>
  <div class="timecode">TEASER 02 · STEEL CLAW</div>
  <div class="capshade" style="bottom:0;height:150px"></div>
  <div class="storycap" id="scap" style="bottom:36px"></div>
  <div class="grade"></div>
</div>
<script>
(function(){
  // Cable content: parts flow in order; r:1 parts get blacked out after typing.
  var HEAD1='CLASSIFIED // CIA DIRECTORATE', HEAD2='OPERATION STEEL CLAW';
  var BODY=[
    {t:'SUBJECT: CAPTURE OF THE PRESIDENT OF BELARUS — MINSK STATION'},{br:1},
    {t:'1. ORDER: THE PRINCIPAL IS TO BE TAKEN AT '},{t:'0230 LOCAL',r:1},
    {t:' BY A '},{t:'SPECIAL ACTIVITIES',r:1},{t:' ELEMENT. NO FLAG. NO CLAIM.'},{br:1},
    {t:'2. A CAPTURED PRESIDENT SIMPLY GOES '},{t:'QUIET',r:1},
    {t:' UNTIL YOU DECIDE WHAT THE WORLD '},{t:'IS TOLD',r:1},{t:'.'},{br:1},
    {t:'3. DENIABILITY HOLDS THROUGH '},{t:'THE INAUGURATION',r:1},
    {t:'. IF IT BLOWS, IT BLOWS '},{t:'ALONE',r:1},{t:'.'}
  ];
  var FOOT=[{t:'ORIGIN: '},{t:'LANGLEY',r:1},{t:' · DISTRIBUTION: PRINCIPAL ONLY · DESTROY AFTER READING'}];
  var body=document.getElementById('body'), foot=document.getElementById('foot');
  var h1=document.getElementById('h1'), h2=document.getElementById('h2');
  // build DOM: each part is a span; redact parts get a mask child
  var parts=[]; var caret=document.createElement('span'); caret.className='caret';
  function build(list,into){
    list.forEach(function(p){
      if(p.br){ into.appendChild(document.createElement('br')); return; }
      var s=document.createElement('span'); if(p.r) s.className='rd';
      var txt=document.createElement('span'); txt.className='txt'; s.appendChild(txt);
      if(p.r){ var m=document.createElement('span'); m.className='mask'; s.appendChild(m); }
      into.appendChild(s);
      parts.push({el:txt, full:p.t, r:p.r, mask:p.r?s.querySelector('.mask'):null});
    });
  }
  build(BODY,body); build(FOOT,foot);
  var TOTAL=parts.reduce(function(a,p){return a+p.full.length},0);
  var T0=0.28, TDUR=1.05;             // body teletype window
  var HT=0.30;                        // heads finish typing by here
  var RSTART=1.48, REACH=0.2, RGAP=0.06; // redaction wipes
  var reds=parts.filter(function(p){return p.r});
  function E(p){p=Math.max(0,Math.min(1,p));return 1-Math.pow(1-p,3)}
  var annot=document.getElementById('annot');
  window.__render=function(t){
    // heads type first, fast
    var hp=Math.max(0,Math.min(1,t/HT));
    h1.textContent=HEAD1.slice(0,Math.round(HEAD1.length*Math.min(1,hp*1.6)));
    h2.textContent=HEAD2.slice(0,Math.round(HEAD2.length*Math.max(0,Math.min(1,(hp-0.35)/0.65))));
    // body teletype: global char budget sweeps all parts in order
    var budget=Math.round(TOTAL*Math.max(0,Math.min(1,(t-T0)/TDUR)));
    var placed=null;
    parts.forEach(function(p){
      var n=Math.max(0,Math.min(p.full.length,budget));
      p.el.textContent=p.full.slice(0,n);
      budget-=p.full.length;
      if(n>0 && n<p.full.length) placed=p;
    });
    // caret rides the write head
    if(caret.parentNode) caret.parentNode.removeChild(caret);
    if(t<T0+TDUR+0.1){
      var host=placed?placed.el:(t<T0?h2:parts[parts.length-1].el);
      host.parentNode.insertBefore(caret,host.nextSibling);
      caret.style.opacity=(t*2.4%1<0.6)?1:0.15;
    }
    // redactions wipe in sequence
    reds.forEach(function(p,i){
      var rp=E((t-(RSTART+i*RGAP))/REACH);
      if(p.mask) p.mask.style.transform='scaleX('+rp+')';
    });
    // stamp
    var on=t>=1.92;
    annot.style.opacity=on?1:0;
    var sp=Math.min(1,(t-1.92)/0.14);
    annot.style.transform='rotate(-6deg) scale('+(on?(1.45-0.45*E(sp)):1.5)+')';
  };
  window.__render(0);
})();
</script>
<script>
(function(){
  var prev=window.__render;
  var el=document.getElementById('scap');
  var FULL='Conduct Covert Operations', T0=1.75, DUR=0.6;
  window.__render=function(t){
    if(prev) prev(t);
    var p=Math.max(0,Math.min(1,(t-T0)/DUR));
    var n=Math.round(FULL.length*p);
    el.innerHTML='<span style="position:relative;display:inline-block;white-space:pre">'+
      '<span style="visibility:hidden">'+FULL+'</span>'+
      '<span style="position:absolute;left:0;top:0;white-space:pre">'+FULL.slice(0,n)+
      (p>0&&p<1?'<span class="capcur"></span>':'')+'</span></span>';
  };
  window.__render(0);
})();
</script>
