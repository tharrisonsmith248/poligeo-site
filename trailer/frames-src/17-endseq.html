<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="frame.css"><link rel="stylesheet" href="anim.css"><script src="anim.js"></script>
<title>End sequence — cube spin → title → wishlist</title>
<style>
  body{background:#0a0f1c}
  .halo{position:absolute; left:50%; top:34%; transform:translate(-50%,-50%);
    width:1400px; height:1000px;
    background:radial-gradient(ellipse 50% 50% at 50% 50%, rgba(201,165,74,0.13), transparent 66%)}
  /* the 3D map-cube, spinning in */
  .scene{position:absolute; left:50%; top:300px; transform:translate(-50%,-50%);
    width:300px; height:300px; perspective:1500px}
  .cube3d{position:relative; width:300px; height:300px; transform-style:preserve-3d;
    transform:rotateX(-18deg) rotateY(-34deg)}
  /* no filter here: drop-shadow forces 3D flattening and kills the cube */
  .face{position:absolute; width:300px; height:300px; background-size:cover; background-position:center;
    border:2px solid #0a101f; box-shadow:inset 0 0 50px rgba(0,0,0,0.4);
    backface-visibility:hidden; -webkit-backface-visibility:hidden}
  /* faces match the PG logo cube: vivid country shapes on bright blue ocean */
  .fmap{background:
      radial-gradient(ellipse 34% 20% at 24% 30%,#3fa06a 0 60%,transparent 62%),
      radial-gradient(ellipse 26% 38% at 66% 46%,#d98a3f 0 58%,transparent 61%),
      radial-gradient(ellipse 40% 16% at 74% 78%,#c04848 0 58%,transparent 61%),
      radial-gradient(ellipse 22% 30% at 38% 72%,#8a6ab8 0 58%,transparent 61%),
      radial-gradient(ellipse 30% 14% at 10% 58%,#3f9d9d 0 56%,transparent 60%),
      radial-gradient(ellipse 18% 26% at 88% 18%,#57b06a 0 56%,transparent 60%),
      linear-gradient(150deg,#2f6ab5,#1c4585)}
  .front{transform:translateZ(150px)}
  .right{transform:rotateY(90deg) translateZ(150px)}
  .back{transform:rotateY(180deg) translateZ(150px)}
  .left{transform:rotateY(270deg) translateZ(150px)}
  .top{transform:rotateX(90deg) translateZ(150px)}
  .pg{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-family:var(--display); font-weight:bold; font-size:215px; color:#d13b30;
    -webkit-text-stroke:7px #0a0d12; text-shadow:0 5px 20px rgba(0,0,0,0.6)}
  /* the real logo takes over at settle */
  .logoimg{position:absolute; left:50%; top:300px; transform:translate(-50%,-50%);
    width:340px; height:auto; filter:drop-shadow(0 0 44px rgba(201,165,74,0.32)); opacity:0}
  /* the stack below */
  .wm{position:absolute; left:50%; top:508px; transform:translateX(-50%); width:620px; opacity:0;
    filter:drop-shadow(0 6px 40px rgba(0,0,0,0.7))}
  .rule{position:absolute; left:50%; top:648px; transform:translateX(-50%);
    width:220px; height:2px; background:var(--gold); opacity:0;
    box-shadow:0 0 20px rgba(201,165,74,0.4)}
  .tagline{position:absolute; left:0; right:0; top:678px; text-align:center; opacity:0;
    font-family:var(--display); font-size:38px; letter-spacing:0.05em; color:var(--muted)}
  .tagline i{font-style:normal; color:var(--ivory)}
  .gsline{position:absolute; left:0; right:0; top:730px; text-align:center; opacity:0;
    font-family:var(--mono); font-size:19px; letter-spacing:0.4em; color:var(--gold);
    text-shadow:0 0 20px rgba(201,165,74,0.3)}
  body.scope .gsline{top:652px}
  .datecard{position:absolute; left:0; right:0; top:764px; text-align:center; opacity:0;
    font-family:var(--display); font-size:34px; letter-spacing:0.34em; color:var(--gold-hi)}
  .ctarow{position:absolute; left:0; right:0; top:836px; text-align:center; opacity:0}
  .cta{display:inline-flex; align-items:center; gap:18px;
    border:2px solid var(--gold); border-radius:4px; padding:18px 42px;
    font-family:var(--display); font-size:27px; letter-spacing:0.22em; color:var(--gold-hi);
    box-shadow:0 0 60px rgba(201,165,74,0.15), inset 0 0 40px rgba(201,165,74,0.05)}
  .steam{width:38px; height:38px}
  .links{position:absolute; left:0; right:0; top:952px; text-align:center; opacity:0;
    font-family:var(--mono); font-size:18px; letter-spacing:0.3em; color:var(--muted)}
  body.scope .scene, body.scope .logoimg{top:258px}
  body.scope .wm{top:448px}
  body.scope .rule{top:578px}
  body.scope .tagline{top:606px}
  body.scope .datecard{top:684px}
  body.scope .ctarow{top:748px}
  body.scope .links{top:862px}
</style>
<div class="stage">
  <div class="halo"></div>
  <div class="field" id="field" style="position:absolute;inset:0;opacity:0.5"></div>
  <div class="scene"><div class="cube3d" id="cube">
    <div class="face fmap top"></div>
    <div class="face fmap left"><div class="pg">G</div></div>
    <div class="face fmap back"><div class="pg">P</div></div>
    <div class="face fmap right"><div class="pg">G</div></div>
    <div class="face fmap front"><div class="pg">P</div></div>
  </div></div>
  <img class="logoimg" id="logoimg" src="logo-cube.png" alt="PG — Politics &amp; Geography">
  <img class="wm" id="wm" src="../../assets/wordmark.png" alt="POLIGEO">
  <div class="rule" id="rule"></div>
  <p class="tagline" id="tag">The Ultimate Geopolitical Simulator</p>
  <div class="gsline" id="gsl">GRAND STRATEGY · REAL TIME</div>
  <div class="datecard" id="date">COMING TO STEAM · OCTOBER 2026</div>
  <div class="ctarow" id="ctarow"><span class="cta">
    <svg class="steam" viewBox="0 0 100 100" aria-label="Steam">
      <circle cx="50" cy="50" r="46" fill="none" stroke="#e3c06a" stroke-width="5"/>
      <circle cx="63" cy="37" r="15" fill="none" stroke="#e3c06a" stroke-width="5"/>
      <circle cx="63" cy="37" r="5" fill="#e3c06a"/>
      <circle cx="34" cy="66" r="9" fill="#e3c06a"/>
      <line x1="42" y1="60" x2="52" y2="46" stroke="#e3c06a" stroke-width="6"/>
    </svg>
    WISHLIST NOW ON STEAM</span></div>
  <div class="links" id="links">POLIGEO.ORG&nbsp;&nbsp;·&nbsp;&nbsp;r/POLIGEO</div>
  <div class="disclaimer">ONE CONTINUOUS SHOT · CUBE SPINS AND SETTLES · TITLE · DATE · WISHLIST LANDS LAST · FINAL CHORD</div>
  <div class="timecode">TEASER 02 · END SEQUENCE</div>
  <div class="grade"></div>
</div>
<script>
// same faint province-dot field as the opening card, so the film closes where it opened
(function(){
  var host=document.getElementById('field');
  function rnd(seed){ return function(){ seed=(seed*1103515245+12345)%2147483648; return seed/2147483648 } }
  var r=rnd(7);
  for(var i=0;i<160;i++){
    var x=r()*1920, y=r()*1080;
    var dx=(x-960)/960, dy=(y-540)/540;
    if(dx*dx+dy*dy<0.16) continue;
    var sz=1.5+r()*2.5;
    var e=document.createElement('div');
    e.style.cssText='position:absolute;border-radius:50%;width:'+sz+'px;height:'+sz+'px;'+
      'left:'+x+'px;top:'+y+'px;background:rgba(143,151,171,'+(0.12+0.3*r()).toFixed(2)+')';
    host.appendChild(e);
  }
})();
(function(){
  var $=function(id){return document.getElementById(id)};
  var cube=$('cube'), scene=document.querySelector('.scene'), logo=$('logoimg');
  var wm=$('wm'), rule=$('rule'), tag=$('tag'), date=$('date'), ctarow=$('ctarow'), links=$('links');
  function E(p){p=Math.max(0,Math.min(1,p));return 1-Math.pow(1-p,3)}
  function fadeUp(el,t,t0,dy){
    var p=E((t-t0)/0.4);
    el.style.opacity=p;
    var base=el.style.getPropertyValue('--basex')||'';
    el.style.transform=(el===wm?'translateX(-50%) ':'')+'translateY('+((dy||24)*(1-p))+'px)';
    if(el===rule) el.style.transform='translateX(-50%) scaleX('+p+')';
    return p;
  }
  window.__render=function(t){
    // cube spin: two-and-a-half fast turns decelerating into the lock over 2.3s
    var sp=E(Math.min(1,t/2.15));
    var ry=-34-900*(1-sp);
    var scale=0.86+0.14*sp;
    cube.style.transform='rotateX(-18deg) rotateY('+ry+'deg) scale('+scale+')';
    // at settle, the map-cube resolves into the actual mark
    var xf=E((t-2.15)/0.42);
    scene.style.opacity=1-xf;
    logo.style.opacity=xf;
    logo.style.transform='translate(-50%,-50%) scale('+(0.94+0.06*xf)+')';
    // the stack lands piece by piece
    fadeUp(wm,t,2.65);
    fadeUp(rule,t,3.1);
    fadeUp(tag,t,3.35);
    var gp=E((t-3.8)/0.4); var gsl=document.getElementById('gsl'); gsl.style.opacity=gp; gsl.style.letterSpacing=(0.55-0.15*gp)+'em';
    // date letterspaces in
    var dp=E((t-4.35)/0.45);
    date.style.opacity=dp;
    date.style.letterSpacing=(0.60-0.26*dp)+'em';
    // wishlist CTA lands last, with a pop
    var cp=E((t-5.1)/0.35);
    ctarow.style.opacity=cp;
    ctarow.style.transform='scale('+(1.12-0.12*cp)+')';
    fadeUp(links,t,5.7,14);
  };
  window.__render(0);
})();
</script>
