<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="frame.css"><link rel="stylesheet" href="anim.css"><script src="anim.js"></script>
<title>Card — resolve foreign wars</title>
<style>
  body{background:#06080f}
  h1{position:absolute; left:0; right:0; top:47%; transform:translateY(-50%); margin:0;
    text-align:center; font-family:var(--display); font-weight:400; font-size:80px;
    letter-spacing:0.05em; color:var(--ivory); text-shadow:0 2px 30px rgba(4,7,14,0.9)}
</style>
<div class="stage">
  <h1 id="l1"></h1>
  <div class="disclaimer">STORY CARD · TYPES IN · PAIRS WITH "OR ESCALATE THEM" ON THE KREMLIN CHAT</div>
  <div class="timecode">TEASER 02 · RESOLVE FOREIGN WARS</div>
  <div class="grade"></div>
</div>
<script>
(function(){
  var l1=document.getElementById('l1');
  var F='Resolve Foreign Wars';
  function E(p){p=Math.max(0,Math.min(1,p));return 1-Math.pow(1-p,3)}
  window.__render=function(t){
    var p=E((t-0.15)/0.55);
    l1.textContent=F;
    l1.style.opacity=p;
    l1.style.transform='translateY('+(-50+2.2*(1-p))+'%)';
  };
  window.__render(0);
})();
</script>
