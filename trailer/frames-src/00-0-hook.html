<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="frame.css"><link rel="stylesheet" href="anim.css"><script src="anim.js"></script>
<title>Hook — the genre card</title>
<style>
  body{background:#070b14}
  .field{position:absolute; inset:0; opacity:0.5}
  h1{position:absolute; left:0; right:0; top:41%; transform:translateY(-50%); margin:0;
    text-align:center; font-family:var(--display); font-weight:400; font-size:76px;
    letter-spacing:0.05em; color:var(--ivory); text-shadow:0 2px 30px rgba(4,7,14,0.9); opacity:0}
  .l2{position:absolute; left:0; right:0; top:55%; text-align:center; opacity:0;
    font-family:var(--display); font-size:36px; letter-spacing:0.14em; color:var(--gold-hi);
    text-shadow:0 0 34px rgba(201,165,74,0.3)}
  .rule{position:absolute; left:50%; top:50.5%; transform:translateX(-50%) scaleX(0);
    width:220px; height:2px; background:var(--gold); box-shadow:0 0 18px rgba(201,165,74,0.4)}
</style>
<div class="stage">
  <div class="field" id="field"></div>
  <h1 id="l1">The Ultimate Geopolitical Simulator</h1>
  <div class="rule" id="rl"></div>
  <div class="l2" id="l2">Grand Strategy Set in the 21st Century</div>
  <div class="disclaimer">THE HOOK · GENRE FIRST · TITLE FOLLOWS</div>
  <div class="timecode">TEASER 02 · HOOK</div>
  <div class="grade"></div>
</div>
<script>
(function(){
  var host=document.getElementById('field');
  function rnd(s){return function(){s=(s*1103515245+12345)%2147483648;return s/2147483648}}
  var r=rnd(7);
  for(var i=0;i<160;i++){
    var x=r()*1920,y=r()*1080,dx=(x-960)/960,dy=(y-540)/540;
    if(dx*dx+dy*dy<0.16) continue;
    var sz=1.5+r()*2.5,e=document.createElement('div');
    e.style.cssText='position:absolute;border-radius:50%;width:'+sz+'px;height:'+sz+'px;left:'+x+
      'px;top:'+y+'px;background:rgba(143,151,171,'+(0.12+0.3*r()).toFixed(2)+')';
    host.appendChild(e);
  }
  var l1=document.getElementById('l1'), l2=document.getElementById('l2'), rl=document.getElementById('rl');
  function E(p){p=Math.max(0,Math.min(1,p));return 1-Math.pow(1-p,3)}
  window.__render=function(t){
    var p1=E((t-0.15)/0.7);
    l1.style.opacity=p1; l1.style.transform='translateY(-50%) translateY('+(16*(1-p1))+'px)';
    l1.style.letterSpacing=(0.11-0.06*p1)+'em';
    rl.style.transform='translateX(-50%) scaleX('+E((t-0.9)/0.4)+')';
    var p2=E((t-1.25)/0.6);
    l2.style.opacity=p2; l2.style.letterSpacing=(0.3-0.16*p2)+'em';
  };
  window.__render(0);
})();
</script>
