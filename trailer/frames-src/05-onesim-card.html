<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="frame.css"><link rel="stylesheet" href="anim.css"><script src="anim.js"></script>
<title>Card — one simulation</title>
<style>
  body{background:#06080f}
  h1{position:absolute; left:0; right:0; top:42%; transform:translateY(-50%); margin:0;
    text-align:center; font-family:var(--display); font-weight:400; font-size:78px;
    letter-spacing:0.05em; color:var(--ivory); text-shadow:0 2px 30px rgba(4,7,14,0.9)}
  .l2{position:absolute; left:0; right:0; top:55%; text-align:center;
    font-family:var(--display); font-size:44px; letter-spacing:0.1em; color:var(--gold-hi);
    text-shadow:0 0 40px rgba(201,165,74,0.3)}
</style>
<div class="stage">
  <h1 id="l1"></h1>
  <div class="l2" id="l2"></div>
  <div class="disclaimer">INTERMISSION CARD · BOTH LINES TYPE IN · GOLD SECOND LINE</div>
  <div class="timecode">TEASER 02 · ONE SIMULATION</div>
  <div class="grade"></div>
</div>
<script>
(function(){
  var l1=document.getElementById('l1'), l2=document.getElementById('l2');
  var F1='One Simulation', F2='Computed in Real Time';
  window.__render=function(t){
    var p1=Math.max(0,Math.min(1,(t-0.1)/0.55));
    l1.textContent=F1.slice(0,Math.round(F1.length*p1));
    var p2=Math.max(0,Math.min(1,(t-0.65)/0.6));
    l2.textContent=F2.slice(0,Math.round(F2.length*p2));
  };
  window.__render(0);
})();
</script>
