<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="frame.css"><link rel="stylesheet" href="anim.css"><script src="anim.js"></script>
<title>0:12 — The war you inherit · 2022 → 2025</title>
<style>
  body{background:#070c16}
  .map{position:absolute; left:270px; top:-10px}
  .hud-top{position:absolute; left:56px; top:50px; font-family:var(--mono); font-size:19px;
    letter-spacing:0.3em; color:var(--muted); z-index:50}
  .hud-top b{color:var(--ivory); font-weight:normal}
  .stages{position:absolute; left:64px; right:64px; bottom:64px; display:flex; gap:20px; z-index:50}
  .stage-chip{flex:1; background:rgba(9,14,26,0.92); border:1px solid var(--line); border-radius:6px;
    padding:14px 18px 10px; display:flex; gap:18px; align-items:center}
  .stage-chip svg{flex:none}
  .stage-chip .txt{font-family:var(--mono); font-size:14px; letter-spacing:0.14em; color:var(--muted); line-height:1.9}
  .stage-chip .txt b{color:var(--ivory); font-weight:normal; font-size:16px}
  .stage-chip.cur{border-color:var(--gold)}
  .stage-chip.cur .txt b{color:var(--gold-hi)}
  .stamp{position:absolute; right:120px; top:150px; z-index:55; transform:rotate(4deg);
    border:4px solid var(--crimson); border-radius:6px; padding:12px 26px;
    font-family:var(--mono); font-size:30px; letter-spacing:0.2em; color:var(--crimson);
    background:rgba(11,18,32,0.5); text-shadow:0 0 24px rgba(176,74,74,0.5)}
</style>
<div class="stage">
  <div class="hud-top">RUSSO-UKRAINIAN WAR · <b>2022 → 2025</b></div>
  <div class="map"><svg id="ua" width="1380" height="1014"></svg></div>
  
  <div class="stages">
    <div class="stage-chip"><svg id="m1" width="200" height="140"></svg>
      <div class="txt"><b>FEB 2022</b></div></div>
    <div class="stage-chip"><svg id="m2" width="200" height="140"></svg>
      <div class="txt"><b>NOV 2022</b></div></div>
    <div class="stage-chip cur"><svg id="m3" width="200" height="140"></svg>
      <div class="txt"><b>JAN 2025</b></div></div>
  </div>
  <div class="disclaimer" style="bottom:24px">TERRITORY TIMELAPSE · THREE YEARS IN FOUR SECONDS</div>
  <div class="timecode" style="bottom:24px">TEASER 02 · 0:15 · H2</div>
  <div class="grade"></div>
</div>
<script src="data.js"></script>
<script>
(function(){
  var NS='http://www.w3.org/2000/svg';
  function firstXY(d){ var m=d.match(/M([\-0-9.]+),([\-0-9.]+)/); return [parseFloat(m[1]),parseFloat(m[2])] }
  // approximate 2022 invasion high-water: 2025 occupied set PLUS northern axes (Kyiv/Chernihiv/Sumy)
  // and the Kharkiv envelope; NOV 2022: 2025 set plus west-bank Kherson pocket.
  function occ2022(t){ var p=firstXY(t.d);
    return t.o || (p[1] < 112 && p[0] > 150) || (p[0] > 380 && p[1] < 150); }
  function occNov22(t){ var p=firstXY(t.d);
    return t.o || (p[0] > 235 && p[0] < 300 && p[1] > 195 && p[1] < 235); }
  function occ2025(t){ return !!t.o }
  function draw(id, occFn, scale){
    var s=document.getElementById(id);
    s.setAttribute('viewBox', UAV.x+' '+UAV.y+' '+UAV.w+' '+UAV.h);
    function el(n,a){var e=document.createElementNS(NS,n); for(var k in a) e.setAttribute(k,a[k]); s.appendChild(e); return e}
    UA_NEI.forEach(function(d){ el('path',{d:d, fill:'#141d33', stroke:'#141d33','stroke-width':7,'stroke-linejoin':'round'}) });
    UA_TILES.forEach(function(t){ el('path',{d:t.d, fill:occFn(t)?'#a84e56':'#46598c',
      stroke:'#111a2e','stroke-width':scale?1.2:0.5}) });
    if(!scale){
      UA_CITIES.forEach(function(c){
        el('circle',{cx:c.x, cy:c.y, r:c.c?2.6:1.5, fill:c.c?'#0a0e1a':'#cfd4e0', opacity:c.c?1:0.7,
          stroke:c.c?'#e8cf8e':'none','stroke-width':c.c?1.3:0});
        if(c.c){var t=el('text',{x:c.x+8,y:c.y+5,'font-size':14,'font-family':'Marcellus, Georgia, serif',
          fill:'#f2e7c8','paint-order':'stroke',stroke:'rgba(7,12,22,0.85)','stroke-width':3}); t.textContent=c.n}
      });
    }
  }
  // small chips: static snapshots
  draw('m1', occ2022, true);
  draw('m2', occNov22, true);
  draw('m3', occ2025, true);
  // BIG map: a live territory timelapse driven by __seek(t).
  var s=document.getElementById('ua');
  s.setAttribute('viewBox', UAV.x+' '+UAV.y+' '+UAV.w+' '+UAV.h);
  function el(n,a,par){var e=document.createElementNS(NS,n); for(var k in a) e.setAttribute(k,a[k]); (par||s).appendChild(e); return e}
  UA_NEI.forEach(function(d){ el('path',{d:d, fill:'#141d33', stroke:'#141d33','stroke-width':7,'stroke-linejoin':'round'}) });
  var HELD='#46598c', OCC='#a84e56', FLASH='#e3c06a';
  var tiles=UA_TILES.map(function(t){
    var p=el('path',{d:t.d, fill:HELD, stroke:'#111a2e','stroke-width':0.5});
    return {p:p, x:firstXY(t.d)[0], a:occ2022(t), b:occNov22(t), c:occ2025(t)};
  });
  UA_CITIES.forEach(function(c){
    el('circle',{cx:c.x, cy:c.y, r:c.c?2.6:1.5, fill:c.c?'#0a0e1a':'#cfd4e0', opacity:c.c?1:0.7,
      stroke:c.c?'#e8cf8e':'none','stroke-width':c.c?1.3:0});
    if(c.c){var tx=el('text',{x:c.x+8,y:c.y+5,'font-size':14,'font-family':'Marcellus, Georgia, serif',
      fill:'#f2e7c8','paint-order':'stroke',stroke:'rgba(7,12,22,0.85)','stroke-width':3}); tx.textContent=c.n}
  });
  var chips=document.querySelectorAll('.stage-chip');
  // phases: [start,end,targetKey]; tiles flip west->east across each phase window
  var PH=[[0.25,1.35,'a'],[1.35,2.45,'b'],[2.45,3.55,'c']];
  var xs=tiles.map(function(t){return t.x}), xmin=Math.min.apply(null,xs), xmax=Math.max.apply(null,xs);
  window.__render=function(t){
    // which phase and progress
    var phi=0; for(var i=0;i<PH.length;i++){ if(t>=PH[i][0]) phi=i; }
    var ph=PH[phi], prog=Math.max(0,Math.min(1,(t-ph[0])/(ph[1]-ph[0])));
    var prevKey = phi===0?'held':PH[phi-1][2];
    var key=ph[2];
    tiles.forEach(function(tl){
      var frac=(tl.x-xmin)/(xmax-xmin);          // 0 west .. 1 east
      var reveal=Math.max(0,Math.min(1,(prog-frac*0.8)/0.2)); // moving front W->E
      var from = prevKey==='held'?false:tl[prevKey];
      var to = tl[key];
      var occNow = reveal>=0.5 ? to : from;
      tl.p.setAttribute('fill', occNow?OCC:HELD);
      // flash the tiles currently flipping
      if(reveal>0.05 && reveal<0.95 && from!==to){
        tl.p.setAttribute('stroke',FLASH); tl.p.setAttribute('stroke-width','1.4');
      } else { tl.p.setAttribute('stroke','#111a2e'); tl.p.setAttribute('stroke-width','0.5'); }
    });
    chips.forEach(function(c,i){ c.classList.toggle('cur', i===phi); });
  };
  window.__render(0);
})();
</script>
