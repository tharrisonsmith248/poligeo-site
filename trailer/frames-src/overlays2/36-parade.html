<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="../frame.css">
<title>Parade system card</title>
<style>
  html,body{background:transparent!important}
  .stage{background:transparent}
  .grade,.disclaimer,.timecode{display:none!important}
  .chyron{position:absolute; left:0; right:0; bottom:0; z-index:50; background:rgba(7,11,20,0.93);
    border-top:3px solid var(--crimson); padding:20px 56px 20px}
  .chyron .plate{display:inline-block; background:var(--crimson); color:var(--ivory);
    font-family:var(--mono); font-size:14px; letter-spacing:0.3em; padding:6px 14px; margin-bottom:10px}
  .chyron h2{font-family:var(--display); font-weight:400; font-size:37px; color:var(--ivory); margin:0}
  .chyron .sub{font-family:var(--mono); font-size:15px; letter-spacing:0.16em; color:#9aa3b8; margin-top:9px}
  .tkband{position:absolute; left:0; right:0; bottom:0; height:44px; background:#060a13;
    border-top:1px solid rgba(150,170,205,0.2)}
  .live{position:absolute; top:52px; left:56px; font-family:var(--mono); font-size:17px;
    letter-spacing:0.28em; color:var(--ivory); z-index:50; text-shadow:0 2px 10px rgba(0,0,0,0.9)}
  .live::before{content:"●"; color:var(--crimson); margin-right:12px}
  .cam{position:absolute; top:52px; right:56px; font-family:var(--mono); font-size:15px;
    letter-spacing:0.22em; color:#b9c1d4; z-index:50; text-shadow:0 2px 10px rgba(0,0,0,0.9)}
  
</style>
<div class="stage">
  <div class="pband"></div>
  <div class="paradeline">
    <h1><span id="pp36">Pursuit of Power is </span><span class="g" style="position:relative;display:inline-block;white-space:pre"><span style="visibility:hidden">Unbounded</span><span id="gl36" style="position:absolute;left:0;top:0;white-space:pre"></span></span></h1>
  </div>
</div>
<script>
(function(){
  var pp=document.getElementById('pp36'), gl=document.getElementById('gl36');
  var GOLD='Unbounded';
  function E(p){p=Math.max(0,Math.min(1,p));return 1-Math.pow(1-p,3)}
  window.__render=function(t){
    var fp=E((t-0.25)/0.5);
    pp.style.opacity=fp;
    // the gold word types left-to-right in place over its reserved width
    var k=Math.round(Math.max(0,Math.min(1,(t-0.9)/0.7))*GOLD.length);
    gl.textContent=GOLD.slice(0,k);
  };
  window.__render(0);
})();
</script>
<style>
  .pband{position:absolute; left:0; right:0; bottom:0; height:340px; z-index:45;
    background:linear-gradient(to top, rgba(4,7,14,0.88) 0%, rgba(4,7,14,0.55) 55%, transparent 100%)}
  .paradeline{position:absolute; left:0; right:0; bottom:96px; text-align:center; z-index:50}
  .kick{font-family:var(--mono); font-size:15px; letter-spacing:0.5em; color:var(--gold);
    text-transform:uppercase; text-shadow:0 2px 14px rgba(0,0,0,0.95); margin-bottom:20px; opacity:0.9}
  .paradeline h1{font-family:var(--display); font-weight:400; font-size:60px; letter-spacing:0.05em;
    color:var(--ivory); margin:0; text-shadow:0 3px 34px rgba(0,0,0,0.95); padding:0 120px; line-height:1.3; white-space:nowrap}
  .paradeline .g{color:var(--gold-hi); text-shadow:0 3px 34px rgba(0,0,0,0.95), 0 0 60px rgba(201,165,74,0.4)}
  .chyron{display:none}
</style>
