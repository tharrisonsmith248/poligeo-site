<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="../frame.css">
<title>War system card</title>
<style>
  html,body{background:transparent!important}
  .stage{background:transparent}
  .grade,.disclaimer,.timecode{display:none!important}
  .chyron{position:absolute; left:0; right:0; bottom:0; z-index:50; background:rgba(7,11,20,0.93);
    border-top:3px solid var(--crimson); padding:20px 56px 20px}
  .chyron .plate{display:inline-block; background:var(--crimson); color:var(--ivory);
    font-family:var(--mono); font-size:14px; letter-spacing:0.3em; padding:6px 14px; margin-bottom:10px}
  .chyron h2{font-family:var(--display); font-weight:400; font-size:37px; color:var(--ivory); margin:0}
  .chyron .sub{font-family:var(--mono); font-size:15px; letter-spacing:0.16em; color:#9aa3b8; margin-top:9px}
  .tkband{position:absolute; left:0; right:0; bottom:0; height:44px; background:#060a13;
    border-top:1px solid rgba(150,170,205,0.2)}
  .live{position:absolute; top:52px; left:56px; font-family:var(--mono); font-size:17px;
    letter-spacing:0.28em; color:var(--ivory); z-index:50; text-shadow:0 2px 10px rgba(0,0,0,0.9)}
  .live::before{content:"●"; color:var(--crimson); margin-right:12px}
  .cam{position:absolute; top:52px; right:56px; font-family:var(--mono); font-size:15px;
    letter-spacing:0.22em; color:#b9c1d4; z-index:50; text-shadow:0 2px 10px rgba(0,0,0,0.9)}
  
</style>
<div class="stage">
  <div class="syscard">
    <div class="kick">The Simulation · Geography</div>
    <h1>Maintain Diplomatic Order.<br><span class="g">Or wage war against the world.</span></h1>
    <div class="pills">
      <span class="spill"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9.2"/><path d="M12 2.8v18.4M12 12l-6.4 6.6M12 12l6.4 6.6"/></svg>Conduct Diplomacy</span><span class="spill sel"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 3.5l13 13M3.5 3.5l3.6.4 9.8 9.8M14.8 18.2l3.4 3.4M13.2 16.6l-1.6 1.6 3.4 3.4M20.5 3.5l-13 13M20.5 3.5l-3.6.4-9.8 9.8M9.2 18.2l-3.4 3.4M10.8 16.6l1.6 1.6-3.4 3.4"/></svg>Wage War</span>
    </div>
  </div>
</div>
<style>
  .syscard{position:absolute; left:0; right:0; top:40%; transform:translateY(-50%); text-align:center; z-index:50}
  .kick{font-family:var(--mono); font-size:16px; letter-spacing:0.5em; color:var(--gold);
    text-transform:uppercase; text-shadow:0 2px 14px rgba(0,0,0,0.95); margin-bottom:26px; opacity:0.9}
  .syscard h1{font-family:var(--display); font-weight:400; font-size:58px; letter-spacing:0.04em;
    color:var(--ivory); margin:0; text-shadow:0 4px 40px rgba(0,0,0,0.95)}
  .spill .ic{width:19px; height:19px; vertical-align:-4px; margin-right:11px}
  .syscard .g{color:var(--gold-hi); text-shadow:0 4px 40px rgba(0,0,0,0.95), 0 0 60px rgba(201,165,74,0.35)}
  .pills{display:flex; gap:18px; justify-content:center; margin-top:38px}
  .spill{font-family:var(--mono); font-size:17px; letter-spacing:0.2em; color:#cfd4de;
    border:1.5px solid rgba(207,212,222,0.4); border-radius:22px; padding:12px 28px;
    background:rgba(10,14,24,0.65); text-transform:uppercase; text-shadow:0 2px 10px rgba(0,0,0,0.9)}
  .spill.sel{color:var(--gold-hi); border-color:var(--gold); box-shadow:0 0 26px rgba(201,165,74,0.35);
    background:rgba(201,165,74,0.14)}
  .chyron{display:none}
</style>
