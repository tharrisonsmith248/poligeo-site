<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="../frame.css">
<title>War or diplomacy info card</title>
<style>
  html,body{background:transparent!important}
  .stage{background:transparent}
  .grade,.disclaimer,.timecode{display:none!important}
  .chyron{position:absolute; left:0; right:0; bottom:0; z-index:50; background:rgba(7,11,20,0.93);
    border-top:3px solid var(--crimson); padding:20px 56px 20px}
  .chyron .plate{display:inline-block; background:var(--crimson); color:var(--ivory);
    font-family:var(--mono); font-size:14px; letter-spacing:0.3em; padding:6px 14px; margin-bottom:10px}
  .chyron h2{font-family:var(--display); font-weight:400; font-size:37px; color:var(--ivory); margin:0}
  .chyron .sub{font-family:var(--mono); font-size:15px; letter-spacing:0.16em; color:#9aa3b8; margin-top:9px}
  .tkband{position:absolute; left:0; right:0; bottom:0; height:44px; background:#060a13;
    border-top:1px solid rgba(150,170,205,0.2)}
  .live{position:absolute; top:52px; left:56px; font-family:var(--mono); font-size:17px;
    letter-spacing:0.28em; color:var(--ivory); z-index:50; text-shadow:0 2px 10px rgba(0,0,0,0.9)}
  .live::before{content:"●"; color:var(--crimson); margin-right:12px}
  .cam{position:absolute; top:52px; right:56px; font-family:var(--mono); font-size:15px;
    letter-spacing:0.22em; color:#b9c1d4; z-index:50; text-shadow:0 2px 10px rgba(0,0,0,0.9)}
  
</style>
<div class="stage">

  <div class="infocard">
    <h1><span class="w1">Wage war.</span> <span class="w2">Or conduct diplomacy.</span></h1>
    <div class="ic-sub">EVERY CONFLICT IS PLAYABLE · EVERY OUTCOME IS YOURS</div>
  </div>
</div>
<style>
  .infocard{position:absolute; left:0; right:0; top:42%; transform:translateY(-50%); text-align:center; z-index:50}
  .infocard h1{font-family:var(--display); font-weight:400; font-size:78px; letter-spacing:0.04em;
    color:var(--ivory); margin:0; text-shadow:0 4px 40px rgba(0,0,0,0.95)}
  .infocard .w2{color:var(--gold-hi); text-shadow:0 4px 40px rgba(0,0,0,0.95), 0 0 60px rgba(201,165,74,0.35)}
  .ic-sub{font-family:var(--mono); font-size:17px; letter-spacing:0.38em; color:#c8cfdf;
    text-shadow:0 2px 14px rgba(0,0,0,0.9); margin-top:26px}
  .chyron{display:none}</style>
