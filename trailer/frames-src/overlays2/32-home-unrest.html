<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="../frame.css">
<title>DC broadcast chrome</title>
<style>
  html,body{background:transparent!important}
  .stage{background:transparent}
  .grade,.disclaimer,.timecode{display:none!important}
  .chyron{position:absolute; left:0; right:0; bottom:0; z-index:50; background:rgba(7,11,20,0.93);
    border-top:3px solid var(--crimson); padding:20px 56px 20px}
  .chyron .plate{display:inline-block; background:var(--crimson); color:var(--ivory);
    font-family:var(--mono); font-size:14px; letter-spacing:0.3em; padding:6px 14px; margin-bottom:10px}
  .chyron h2{font-family:var(--display); font-weight:400; font-size:37px; color:var(--ivory); margin:0}
  .chyron .sub{font-family:var(--mono); font-size:15px; letter-spacing:0.16em; color:#9aa3b8; margin-top:9px}
  .tkband{position:absolute; left:0; right:0; bottom:0; height:44px; background:#060a13;
    border-top:1px solid rgba(150,170,205,0.2)}
  .live{position:absolute; top:52px; left:56px; font-family:var(--mono); font-size:17px;
    letter-spacing:0.28em; color:var(--ivory); z-index:50; text-shadow:0 2px 10px rgba(0,0,0,0.9)}
  .live::before{content:"●"; color:var(--crimson); margin-right:12px}
  .cam{position:absolute; top:52px; right:56px; font-family:var(--mono); font-size:15px;
    letter-spacing:0.22em; color:#b9c1d4; z-index:50; text-shadow:0 2px 10px rgba(0,0,0,0.9)}
  
</style>
<div class="stage">
  <div class="live">LIVE · WASHINGTON DC</div>
  <div class="cam">PENNSYLVANIA AVE</div>
  <div class="bcast">
    <div class="tabs"><span class="tab red">Breaking</span><span class="tab dark">Wire Tonight</span></div>
    <div class="band"><span class="hl" style="font-size:31px">UNREST REACHES THE CAPITAL; PRESIDENT ISSUES LETHAL ORDER</span>
      <span class="mark"><b>WIRE</b><i>LIVE</i></span></div>
    <div class="strip"><span class="ts">11:40 PM ET</span><span class="chev">›</span><div class="win"></div></div>
  </div>
</div>
<style>
  .bcast{position:absolute; left:56px; right:56px; bottom:16px; z-index:50;
    font-family:'Liberation Sans','DejaVu Sans',sans-serif}
  .tabs{display:flex; padding-left:8px}
  .tab{font-weight:bold; font-size:20px; letter-spacing:0.03em; padding:9px 20px 7px;
    border-radius:7px 7px 0 0; color:#fff; text-transform:uppercase}
  .tab.red{background:#c0322e}
  .tab.dark{background:#23262e; color:#e9e9e9}
  .band{background:#f4f2ec; border-radius:5px; display:flex; align-items:center; height:74px;
    padding:0 20px; box-shadow:0 8px 30px rgba(0,0,0,0.55)}
  .hl{flex:1; color:#101010; font-weight:bold; white-space:nowrap; letter-spacing:-0.01em;
    transform:scaleX(0.94); transform-origin:left center}
  .mark{text-align:center; padding-left:16px}
  .mark b{display:block; color:#c0322e; font-size:33px; font-weight:900; font-style:italic;
    letter-spacing:-0.02em; line-height:1}
  .mark i{display:block; color:#c0322e; font-size:12px; letter-spacing:0.4em; font-style:normal;
    font-weight:bold; margin-top:2px; border-top:2.5px solid #c0322e; padding-top:2px}
  .strip{display:flex; align-items:center; background:#14161c}
  .strip{border-radius:0 0 5px 5px; height:42px; margin-top:3px}
  .ts{color:#fff; font-weight:bold; font-size:19px; padding:0 18px; white-space:nowrap}
  .chev{color:#9aa0ab; padding-right:12px; font-size:21px; font-weight:bold}
  .win{flex:1; overflow:hidden; white-space:nowrap; height:100%; display:flex; align-items:center; margin-right:18px}
</style>
