<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="frame.css">
<title>0:28 — The hand that doesn't pull</title>
<style>

    box-shadow:0 -20px 80px rgba(0,0,0,0.5)}

    font-family:var(--mono); font-size:14px; letter-spacing:0.26em; color:#7a4646}

  .hand{position:absolute; right:-60px; bottom:-100px; width:1350px; height:1000px;
    filter:blur(11px); opacity:0.96}
  .hand svg{width:100%; height:100%}
  .hint{position:absolute; left:0; right:0; bottom:132px; text-align:center;
    font-family:var(--mono); font-size:16px; letter-spacing:0.4em; color:#46536f}
</style>
