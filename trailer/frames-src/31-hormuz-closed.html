<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="frame.css"><link rel="stylesheet" href="anim.css"><script src="anim.js"></script>
<title>0:38 — Iran closes the strait</title>
<style>
  body{background:#070b14}
  .mapbox{position:absolute; left:80px; top:120px; width:1000px; height:640px}
  .markets{position:absolute; right:80px; top:120px; width:660px}
  .m-panel{border:1px solid var(--line-soft); border-radius:6px; background:rgba(10,16,31,0.85);
    padding:16px 22px 10px; margin-bottom:16px}
  .cl{display:flex; justify-content:space-between; font-family:var(--mono); font-size:16px;
    letter-spacing:0.2em; color:var(--muted); margin-bottom:4px}
  .cl .up{color:#e3c06a} .cl .dn{color:#d98a8a}
  .rows{font-family:var(--mono); font-size:15.5px}
  .rw{display:flex; justify-content:space-between; padding:10px 2px; border-bottom:1px solid var(--line-soft); color:var(--muted)}
  .rw b{color:var(--ivory); font-weight:normal} .rw .warn{color:#d98a8a}
  .chyron{position:absolute; left:0; right:0; bottom:0; z-index:50; background:rgba(7,11,20,0.95);
    border-top:3px solid var(--crimson); padding:20px 56px 0}
  .chyron h2{margin-bottom:14px}
  .tickerbar{margin:0 -56px; border-top:1px solid var(--line-soft); background:#060a13;
    overflow:hidden; white-space:nowrap; padding:11px 0 13px}
  .tk{display:inline-block; font-family:var(--mono); font-size:16px; letter-spacing:0.14em;
    color:#c8933f; white-space:nowrap; will-change:transform}
  .tk b{color:var(--ivory); font-weight:normal}
  .chyron .plate{display:inline-block; background:var(--crimson); color:var(--ivory);
    font-family:var(--mono); font-size:14px; letter-spacing:0.3em; padding:6px 14px; margin-bottom:12px}
  .chyron h2{font-family:var(--display); font-weight:400; font-size:40px; color:var(--ivory); margin:0}
</style>
<div class="stage">
  <svg class="mapbox" id="gulfmap" viewBox="0 0 1000 640"></svg>
  <div class="markets">
    <div class="m-panel">
      <div class="cl"><span>BRENT CRUDE · $/BBL</span><span class="up"><span id="oilp">118.60</span> ▲ <span id="oilpc">41</span>%</span></div>
      <svg id="oil" width="600" height="230" viewBox="0 0 600 230"></svg>
    </div>
    <div class="m-panel rows">
      <div class="rw"><span>GAS · NATIONAL AVG</span><b class="warn">$4.61 ▲ 1.49</b></div>
      <div class="rw"><span>S&amp;P 500</span><b class="warn">▼ 6.2% · CIRCUIT BREAKER</b></div>
      <div class="rw"><span>FREIGHT INDEX</span><b class="warn">3,940 ▲ 227%</b></div>
      <div class="rw"><span>STRATEGIC RESERVE</span><b>RELEASE ORDERED</b></div>
    </div>
  </div>
  <div class="chyron">
    <span class="plate">● BREAKING</span>
    <h2>Iran closes the Strait of Hormuz to all shipping</h2>
    <div class="tickerbar"><div class="tk" id="tk"></div></div>
  </div>
  <div class="timecode" style="bottom:110px">TEASER 02 · 0:41</div>
  <div class="grade"></div>
</div>
<script src="world.js"></script>
<script>
(function(){
  var NS='http://www.w3.org/2000/svg';
  var svg=document.getElementById('gulfmap');
  function el(n,a,txt){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);
    if(txt)e.textContent=txt; svg.appendChild(e); return e}
  el('rect',{width:1000,height:640,fill:'#0a1120',rx:8});
  GULF.forEach(function(c){
    el('path',{d:c.d, fill:c.i==='IRN'?'#16233c':'#131d33', stroke:'#243352','stroke-width':1});
  });
  el('text',{x:560,y:150,'font-family':'DejaVu Sans Mono','font-size':20,'letter-spacing':6,fill:'#3d4a6b'},'IRAN');
  el('text',{x:200,y:520,'font-family':'DejaVu Sans Mono','font-size':17,'letter-spacing':5,fill:'#3d4a6b'},'SAUDI ARABIA');
  el('text',{x:760,y:560,'font-family':'DejaVu Sans Mono','font-size':15,'letter-spacing':4,fill:'#3d4a6b'},'OMAN');
  el('text',{x:330,y:330,'font-family':'DejaVu Sans Mono','font-size':15,'letter-spacing':4,fill:'#2c3c60'},'PERSIAN GULF');
  el('text',{x:780,y:470,'font-family':'DejaVu Sans Mono','font-size':14,'letter-spacing':3,fill:'#2c3c60'},'GULF OF OMAN');
  // shipping lanes: dashes march along them until the strait slams shut
  var lane1=el('path',{d:'M180 290 L300 320 L420 345 L540 355 L620 358 L648 362', stroke:'#3d5a94',
    'stroke-width':4,'stroke-dasharray':'14 10',fill:'none',opacity:0.85});
  var lane2=el('path',{d:'M703 380 Q760 420 830 455', stroke:'#3d5a94','stroke-width':4,'stroke-dasharray':'14 10',fill:'none',opacity:0.85});
  var hx=HORMUZ[0], hy=HORMUZ[1];
  var ring=el('circle',{cx:hx,cy:hy,r:46,fill:'none',stroke:'#b04a4a','stroke-width':3});
  var x1=el('line',{x1:hx-28,y1:hy-28,x2:hx+28,y2:hy+28,stroke:'#b04a4a','stroke-width':9,'stroke-linecap':'round'});
  var x2=el('line',{x1:hx+28,y1:hy-28,x2:hx-28,y2:hy+28,stroke:'#b04a4a','stroke-width':9,'stroke-linecap':'round'});
  var lab1=el('text',{x:hx,y:hy+82,'text-anchor':'middle','font-family':'DejaVu Sans Mono','font-size':16,'letter-spacing':3,fill:'#d98a8a'},'STRAIT OF HORMUZ');
  var lab2=el('text',{x:hx,y:hy+106,'text-anchor':'middle','font-family':'DejaVu Sans Mono','font-size':16,'letter-spacing':3,fill:'#d98a8a'},'CLOSED');
  var mines=[[hx-32,hy-14],[hx-8,hy+26],[hx+24,hy-20],[hx+38,hy+16]].map(function(c){
    return el('circle',{cx:c[0],cy:c[1],r:5,fill:'#b04a4a'});
  });
  // tanker queue: they creep along the lane, then bunch up and hold
  var TK=[[210,296],[260,308],[310,322],[360,334],[410,343],[460,350],[510,353],[560,356]];
  var tankers=TK.map(function(c){ return el('rect',{x:c[0],y:c[1]-5,width:32,height:10,rx:3,fill:'#8f97ab'}); });
  var tlab=el('text',{x:180,y:262,'font-family':'DejaVu Sans Mono','font-size':14,'letter-spacing':2,fill:'#5b647c'},'TANKERS HOLDING');
  el('text',{x:20,y:626,'font-family':'DejaVu Sans Mono','font-size':12,'letter-spacing':2,fill:'#3d4a6b'},'REAL COASTLINES \u00b7 NATURAL EARTH 50M');

  var CLOSE=0.90;  // the strait slams shut here
  function E(p){p=Math.max(0,Math.min(1,p));return 1-Math.pow(1-p,3)}
  window.__hormuz=function(t){
    // dashes march toward the strait; after close they stop
    var march=Math.min(t,CLOSE)*40;
    lane1.setAttribute('stroke-dashoffset',-march);
    lane2.setAttribute('stroke-dashoffset',-march);
    lane2.setAttribute('opacity', t>CLOSE?0.25:0.85);
    // X draws in at CLOSE with a snap
    var xp=E((t-CLOSE)/0.22);
    [x1,x2].forEach(function(x,i){
      var d=i===0?[-28,-28,28,28]:[28,-28,-28,28];
      x.setAttribute('x2', hx+d[0]+(d[2]-d[0])*xp);
      x.setAttribute('y2', hy+d[1]+(d[3]-d[1])*xp);
      x.setAttribute('opacity', t>CLOSE?1:0);
    });
    // ring pulses after close
    var pulse=1+0.10*Math.sin((t-CLOSE)*7);
    ring.setAttribute('r', t>CLOSE?46*pulse:0.001);
    ring.setAttribute('opacity', t>CLOSE?0.55+0.45*Math.abs(Math.sin((t-CLOSE)*7)):0);
    lab1.setAttribute('opacity', t>CLOSE+0.18?1:0);
    lab2.setAttribute('opacity', t>CLOSE+0.30?1:0);
    mines.forEach(function(m,i){ m.setAttribute('opacity', t>CLOSE+0.1+i*0.06?1:0); });
    // tankers creep toward the strait until it closes, then hold
    var drift=Math.min(t,CLOSE)*26;
    tankers.forEach(function(r,i){ r.setAttribute('x', TK[i][0]+drift*(1-i*0.06)); });
    tlab.textContent='TANKERS HOLDING \u00b7 '+Math.round(Math.max(0,Math.min(1,(t-CLOSE)/1.4))*63);
    tlab.setAttribute('opacity', t>CLOSE?1:0.4);
  };
  window.__hormuz(0);
})();
</script>
<script>
(function(){
  var NS='http://www.w3.org/2000/svg', svg=document.getElementById('oil');
  function rnd(s){ return function(){ s=(s*1103515245+12345)%2147483648; return s/2147483648 } }
  var r=rnd(29), n=40, W=600, H=230, cw=W/n, price=100, data=[];
  for(var i=0;i<n;i++){
    var drift = i>n*0.62 ? 2.6 : 0.05;
    var o=price, c=price+drift+(r()-0.5)*2.6;
    data.push([o, Math.max(o,c)+r()*1.5, Math.min(o,c)-r()*1.5, c]); price=c;
  }
  var min=Math.min.apply(null,data.map(d=>d[2])), max=Math.max.apply(null,data.map(d=>d[1]));
  function y(v){ return 12+(max-v)/(max-min)*(H-24) }
  var groups=data.map(function(d,i){
    var g=document.createElementNS(NS,'g'); svg.appendChild(g);
    var x=i*cw+cw/2, up=d[3]>=d[0], col=up?'#4c8b62':'#b04a4a';
    if(i>n*0.62) col=up?'#c9a54a':'#b04a4a';
    var w=document.createElementNS(NS,'line');
    w.setAttribute('x1',x); w.setAttribute('x2',x); w.setAttribute('y1',y(d[1])); w.setAttribute('y2',y(d[2]));
    w.setAttribute('stroke',col); w.setAttribute('stroke-width','1.4'); g.appendChild(w);
    var b=document.createElementNS(NS,'rect');
    var top=y(Math.max(d[0],d[3])), bot=y(Math.min(d[0],d[3]));
    b.setAttribute('x',x-cw*0.32); b.setAttribute('width',cw*0.64);
    b.setAttribute('y',top); b.setAttribute('height',Math.max(2,bot-top)); b.setAttribute('fill',col);
    g.appendChild(b); return g;
  });
  var oilp=document.getElementById('oilp'), oilpc=document.getElementById('oilpc');
  var tk=document.getElementById('tk');
  var TKTEXT='BRENT CRUDE SPIKES 41% \u2022 63 TANKERS HOLDING IN THE GULF \u2022 FREIGHT RATES UP 227% \u2022 '+
    'STRATEGIC RESERVE RELEASE ORDERED \u2022 CIRCUIT BREAKER TRIPS ON THE S&P \u2022 GAS $4.61 NATIONAL AVG \u2022 ';
  tk.textContent=TKTEXT+TKTEXT+TKTEXT;
  function E(p){p=Math.max(0,Math.min(1,p));return 1-Math.pow(1-p,3)}
  window.__render=function(t){
    if(window.__hormuz) window.__hormuz(t);
    // candles sweep in left->right; the spike section lands after the close
    var vis=Math.round(groups.length*Math.max(0,Math.min(1,(t-0.15)/1.8)));
    groups.forEach(function(g,i){ g.setAttribute('opacity', i<vis?1:0); });
    var pp=E((t-0.9)/1.4);
    oilp.textContent=(84+34.6*pp).toFixed(2);
    oilpc.textContent=Math.round(41*pp);
    tk.style.transform='translateX('+(-t*230)+'px)';
  };
  window.__render(0);
})();
</script>
