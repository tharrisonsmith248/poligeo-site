<style>

</div>
<script>
(function(){
  var NS='http://www.w3.org/2000/svg', svg=document.getElementById('oil');
  function rnd(s){ return function(){ s=(s*1103515245+12345)%2147483648; return s/2147483648 } }
  var r=rnd(29), n=40, W=600, H=230, cw=W/n, price=100, data=[];
  for(var i=0;i<n;i++){
    var drift = i>n*0.62 ? 2.6 : 0.05;
    var o=price, c=price+drift+(r()-0.5)*2.6;
    data.push([o, Math.max(o,c)+r()*1.5, Math.min(o,c)-r()*1.5, c]); price=c;
  }
  var min=Math.min.apply(null,data.map(d=>d[2])), max=Math.max.apply(null,data.map(d=>d[1]));
  function y(v){ return 12+(max-v)/(max-min)*(H-24) }
  data.forEach(function(d,i){
    var x=i*cw+cw/2, up=d[3]>=d[0], col=up?'#4c8b62':'#b04a4a';
    if(i>n*0.62) col=up?'#c9a54a':'#b04a4a';
    var w=document.createElementNS(NS,'line');
    w.setAttribute('x1',x); w.setAttribute('x2',x); w.setAttribute('y1',y(d[1])); w.setAttribute('y2',y(d[2]));
    w.setAttribute('stroke',col); w.setAttribute('stroke-width','1.4'); svg.appendChild(w);
    var b=document.createElementNS(NS,'rect');
    var top=y(Math.max(d[0],d[3])), bot=y(Math.min(d[0],d[3]));
    b.setAttribute('x',x-cw*0.32); b.setAttribute('width',cw*0.64);
    b.setAttribute('y',top); b.setAttribute('height',Math.max(2,bot-top)); b.setAttribute('fill',col);
    svg.appendChild(b);
  });
})();
</script>
