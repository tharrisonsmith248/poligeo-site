<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="frame.css"><link rel="stylesheet" href="anim.css"><script src="anim.js"></script>
<title>0:00 — Title intro</title>
<style>
  body{background:#080d18}
  /* faint world of province dots behind the mark */
  .field{position:absolute; inset:0; opacity:0.5}
  .halo{position:absolute; left:50%; top:46%; transform:translate(-50%,-50%);
    width:1400px; height:1000px;
    background:radial-gradient(ellipse 46% 46% at 50% 50%, rgba(201,165,74,0.09), transparent 68%)}
  .stack{position:absolute; left:0; right:0; top:50%; transform:translateY(-52%); text-align:center}
  .stack .cube{width:340px; height:auto; filter:drop-shadow(0 0 60px rgba(201,165,74,0.35))}
  .stack .wm{display:block; width:640px; height:auto; margin:30px auto 0;
    filter:drop-shadow(0 6px 40px rgba(0,0,0,0.7))}
  .rule{width:200px; height:2px; background:var(--gold); margin:34px auto 30px;
    box-shadow:0 0 18px rgba(201,165,74,0.4)}
  .genre{font-family:var(--display); font-size:32px; letter-spacing:0.32em; color:var(--gold-hi);
    text-transform:uppercase; text-shadow:0 0 30px rgba(201,165,74,0.25)}
  .presents{position:absolute; left:0; right:0; top:110px; text-align:center;
    font-family:var(--mono); font-size:16px; letter-spacing:0.5em; color:var(--dim)}
</style>
<div class="stage">
  <div class="halo"></div>
  <div class="field" id="field"></div>
  <div class="stack">
    <img class="cube" src="logo-cube.png" alt="PG cube">
    <img class="wm" src="../../assets/wordmark.png" alt="POLIGEO">
    <div class="rule"></div>
    <div class="genre">The Ultimate Geopolitical Simulator</div>
  </div>
  <div class="disclaimer">OPENS THE FILM · CALM, NO DRUMS YET · CUBE GLOWS, WORDMARK RESOLVES, GENRE LINE FADES UP</div>
  <div class="timecode">TEASER 02 · 0:00–0:03</div>
  <div class="grade"></div>
</div>
<script>
// faint scattered province dots, denser toward the edges so the mark stays clean
(function(){
  var host=document.getElementById('field');
  function rnd(seed){ return function(){ seed=(seed*1103515245+12345)%2147483648; return seed/2147483648 } }
  var r=rnd(7);
  for(var i=0;i<160;i++){
    var x=r()*1920, y=r()*1080;
    var dx=(x-960)/960, dy=(y-540)/540, d2=dx*dx+dy*dy;
    if(d2<0.16) continue;                       // keep the center clear
    var sz=1.5+r()*2.5;
    var e=document.createElement('div');
    e.style.cssText='position:absolute;border-radius:50%;width:'+sz+'px;height:'+sz+'px;'+
      'left:'+x+'px;top:'+y+'px;background:rgba(143,151,171,'+(0.12+0.3*r()).toFixed(2)+')';
    host.appendChild(e);
  }
})();
</script>
