<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="frame.css"><link rel="stylesheet" href="anim.css"><script src="anim.js"></script>
<title>0:29.5 — The held breath</title>
<style>
  body{background:#06080f}
  .line{position:absolute; left:0; right:0; top:50%; transform:translateY(-50%);
    text-align:center; font-family:var(--display); font-size:64px; letter-spacing:0.06em; color:var(--ivory)}
  .line .g{color:var(--gold-hi)}

  .sysk{font-family:var(--mono); font-size:16px; letter-spacing:0.5em; color:var(--gold);
    opacity:0.85; text-transform:uppercase; text-shadow:0 2px 12px rgba(0,0,0,0.8)}
  .sysrule{width:200px; height:2px; background:var(--gold); margin:26px auto;
    box-shadow:0 0 18px rgba(201,165,74,0.4); transform:scaleX(0)}
  .syssub{font-family:var(--mono); font-size:16px; letter-spacing:0.34em; color:var(--muted);
    text-transform:uppercase; text-shadow:0 2px 12px rgba(0,0,0,0.8)}
  .pills{display:flex; gap:18px; justify-content:center; margin-top:34px}
  .spill{font-family:var(--mono); font-size:17px; letter-spacing:0.2em; color:var(--muted);
    border:1.5px solid var(--line); border-radius:22px; padding:12px 26px; background:rgba(17,26,46,0.75);
    text-transform:uppercase}
  .spill.sel{color:var(--gold-hi); border-color:var(--gold); box-shadow:0 0 22px rgba(201,165,74,0.3);
    background:rgba(201,165,74,0.12)}

  .kick{position:absolute; left:0; right:0; top:33%; text-align:center; opacity:0}
</style>
<div class="stage">
  <div class="kick sysk" id="kk">One Term</div>
  <div class="line">Define the Nation&rsquo;s <span class="g">Future</span>.&nbsp;<span class="cursor" style="width:0.5em;height:0.95em"></span></div>
  <div class="disclaimer">CAESURA · TOTAL SILENCE · 0.5 SECONDS · TYPE-ON IS INSTANT</div>
  <div class="timecode">TEASER 02 · 0:49.5</div>
</div>
<script>
(function(){
  var line=document.querySelector('.line'), cur=document.querySelector('.cursor');
  var pre='Define the Nation\u2019s ', gold='Future', post='.';
  var total=pre.length+gold.length+post.length;
  window.__render=function(t){
    var kk=document.getElementById('kk'); if(kk) kk.style.opacity=Math.max(0,Math.min(1,(t-0.05)/0.4))*0.85;
    var p=Math.max(0,Math.min(1,(t-0.12)/0.93)); var k=Math.round(p*total);
    var html;
    if(k<=pre.length) html=pre.slice(0,k);
    else if(k<=pre.length+gold.length) html=pre+'<span class="g">'+gold.slice(0,k-pre.length)+'</span>';
    else html=pre+'<span class="g">'+gold+'</span>'+post.slice(0,k-pre.length-gold.length);
    line.innerHTML=html+'<span class="cursor" style="width:0.5em;height:0.95em;opacity:'+((t*2%1<0.55)?1:0.1)+'"></span>';
  };
  window.__render(0);
})();
</script>
