<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="frame.css">
<title>0:03 — The claim</title>
<style>
  body{background:#080d18}
  .halo{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:1500px; height:900px;
    background:radial-gradient(ellipse 46% 44% at 50% 50%, rgba(201,165,74,0.08), transparent 68%)}
  .field{position:absolute; inset:0; opacity:0.45}
  .claim{position:absolute; left:0; right:0; top:50%; transform:translateY(-56%); text-align:center}
  .claim h1{font-family:var(--display); font-weight:400; font-size:78px; line-height:1.25;
    letter-spacing:0.04em; color:var(--ivory); margin:0;
    text-shadow:0 2px 30px rgba(4,7,14,0.9)}
  .claim h1 .g{color:var(--gold-hi)}
  .claim h1 .silver{font-weight:bold;
    background:linear-gradient(180deg,#f2f5fa 0%, #c4ccd9 45%, #8d97a8 55%, #dfe5ee 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 2px 14px rgba(200,210,225,0.35))}
  .claim .sub{font-family:var(--mono); font-size:19px; letter-spacing:0.34em; color:var(--muted);
    margin-top:44px}
</style>
<div class="stage">
  <div class="halo"></div>
  <div class="field" id="field"></div>
  <div class="claim">
    <h1>Rule Democratically&hellip;<br><span class="typed">or with an <span class="silver">Iron&nbsp;Fist</span></span><span class="cursor" style="width:0.45em;height:0.85em;margin-left:14px"></span></h1>
  </div>
  <div class="disclaimer">SECOND TITLE CARD · PART AFTER THE ELLIPSIS TYPES IN WITH THE SLIDE · IRON FIST IN BOLD SILVER</div>
  <div class="timecode">TEASER 02 · 0:03–0:05.5</div>
  <div class="grade"></div>
</div>
<script>
(function(){
  var host=document.getElementById('field');
  function rnd(seed){ return function(){ seed=(seed*1103515245+12345)%2147483648; return seed/2147483648 } }
  var r=rnd(13);
  for(var i=0;i<140;i++){
    var x=r()*1920, y=r()*1080;
    var dx=(x-960)/960, dy=(y-540)/540;
    if(dx*dx+dy*dy<0.14) continue;
    var sz=1.5+r()*2.5;
    var e=document.createElement('div');
    e.style.cssText='position:absolute;border-radius:50%;width:'+sz+'px;height:'+sz+'px;'+
      'left:'+x+'px;top:'+y+'px;background:rgba(143,151,171,'+(0.10+0.28*r()).toFixed(2)+')';
    host.appendChild(e);
  }
})();
</script>
