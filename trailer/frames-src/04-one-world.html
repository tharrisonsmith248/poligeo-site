<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="frame.css"><link rel="stylesheet" href="anim.css"><script src="anim.js"></script>
<title>0:13 — H1 · One living world</title>
<style>
  body{background:#0a101f}
  .map{position:absolute; left:0; top:-100px}
  .shade{position:absolute; inset:0;
    background:linear-gradient(to bottom, rgba(7,12,22,0.5) 0%, rgba(7,12,22,0.05) 26%,
      rgba(7,12,22,0.1) 72%, rgba(7,12,22,0.75) 100%)}
  .counters{
    position:absolute; left:56px; top:56px; z-index:50; display:flex; gap:56px;
    font-family:var(--mono);
  }
  .counter .n{font-size:56px; color:var(--gold-hi); letter-spacing:0.04em;
    text-shadow:0 2px 20px rgba(0,0,0,0.85)}
  .counter .l{font-size:17px; letter-spacing:0.3em; color:var(--muted); margin-top:8px;
    text-shadow:0 2px 12px rgba(0,0,0,0.85)}
  .cities{position:absolute; inset:0; pointer-events:none; z-index:30}
  .city{position:absolute; transform:translate(-50%,-50%); display:flex; align-items:center; gap:8px; opacity:0}
  .city .dot{width:9px; height:9px; border-radius:50%; background:#e3c06a; border:1.5px solid #0a0e1a;
    box-shadow:0 0 12px rgba(227,192,106,0.7)}
  .city .nm{font-family:var(--serif); font-size:19px; color:#f2e7c8;
    text-shadow:0 1px 3px rgba(7,12,22,0.95), 0 0 14px rgba(7,12,22,0.9)}
  .sysk{font-family:var(--mono); font-size:14px; letter-spacing:0.44em; color:var(--gold); opacity:0; text-transform:uppercase; text-shadow:0 2px 12px rgba(0,0,0,0.8)}
</style>
<div class="stage">
  <div class="map"><svg id="world" width="5184" height="2838" viewBox="0 0 1920 1051"></svg></div>
  <div class="cities" id="cities"></div>
  <div class="shade"></div>
  <div class="counters">
    <div class="counter"><div class="n" id="c1">200+</div><div class="l">NATIONS</div></div>
    <div class="counter"><div class="n" id="c2">4,454</div><div class="l">PROVINCES</div></div>
    <div class="counter"><div class="n" id="c3">14,262</div><div class="l">TILES</div></div>
  </div>
  <div class="disclaimer">REAL GEOGRAPHY (NATURAL EARTH) IN THE GAME'S RELATIONS THEME · STARTS FULL GLOBE · ZOOMS TO THE US</div>
  <div class="timecode">TEASER 02 · 0:13 · H1</div>
  <div class="grade"></div>
</div>
<script src="world.js"></script>
<script src="us-states.js"></script>
<script src="na-detail.js"></script>
<script>
(function(){
  var NS='http://www.w3.org/2000/svg';
  var svg=document.getElementById('world');
  // relations-style coloring: player blue, aligned blues, hostile reds, everyone else muted
  var PLAYER={USA:1};
  var ALLY={CAN:1,GBR:1,FRA:1,DEU:1,ITA:1,ESP:1,PRT:1,NLD:1,BEL:1,DNK:1,NOR:1,SWE:1,FIN:1,POL:1,
    CZE:1,SVK:1,AUT:1,CHE:1,IRL:1,ISL:1,GRC:1,TUR:0,ROU:1,BGR:1,HRV:1,SVN:1,HUN:1,EST:1,LVA:1,
    LTU:1,UKR:1,JPN:1,KOR:1,AUS:1,NZL:1,ISR:1,TWN:1,PHL:1};
  var RIVAL={RUS:1,CHN:1,IRN:1,PRK:1,BLR:1,VEN:1,CUB:1,SYR:1,NIC:1,MMR:1,ERI:1,MLI:1,AFG:1};
  var MUTED=['#5b6a8a','#7a6a51','#6e5a52','#55707f','#6b5f82','#7d7250','#51617f','#68727f',
             '#7f5f57','#5f7a6c'];
  function hash(s){var h=0;for(var i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))>>>0}return h}
  WORLD.forEach(function(c){
    var fill;
    if(PLAYER[c.i]) fill='#3d6ac0';
    else if(ALLY[c.i]) fill=['#46598c','#3f63a8','#54689c'][hash(c.i)%3];
    else if(RIVAL[c.i]) fill=['#a04444','#8f3a3a','#b04a4a'][hash(c.i)%3];
    else fill=MUTED[hash(c.i)%MUTED.length];
    var p=document.createElementNS(NS,'path');
    p.setAttribute('d',c.d);
    p.setAttribute('fill',fill);
    p.setAttribute('stroke','#0a101f');
    p.setAttribute('stroke-width','1');
    svg.appendChild(p);
  });
  // --- seek-driven zoom: full globe -> the US; states + metros resolve, world grays out ---
  // the svg is laid out at 2.7x native size and scaled DOWN, so the browser
  // rasterizes at full resolution and the end of the push-in is pixel-crisp
  var K=2.7;
  var map=document.querySelector('.map');
  map.style.transformOrigin='0px 0px';
  map.style.willChange='transform';
  // remember each country's color; USA stays blue, the world fades to gray silhouette
  function hex2rgb(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]}
  function mix(a,b,p){return 'rgb('+Math.round(a[0]+(b[0]-a[0])*p)+','+Math.round(a[1]+(b[1]-a[1])*p)+','+Math.round(a[2]+(b[2]-a[2])*p)+')'}
  var GRAY=hex2rgb('#39404f');
  var cpaths=[].slice.call(svg.children).map(function(p,i){
    return {p:p, usa:WORLD[i]&&WORLD[i].i==='USA', rgb:hex2rgb(p.getAttribute('fill'))};
  });
  // US state boundaries (stroke-only), hidden until the push-in
  var NS2='http://www.w3.org/2000/svg';
  // 50m gray neighbor silhouettes: at zoom they replace the coarse 110m shapes
  // around the US so the close-up coastline stays crisp.
  var naG=document.createElementNS(NS2,'g');
  NA_DETAIL.forEach(function(d){
    var p=document.createElementNS(NS2,'path');
    p.setAttribute('d',d); p.setAttribute('fill','#39404f');
    p.setAttribute('stroke','#0b1424'); p.setAttribute('stroke-width','0.6');
    p.setAttribute('stroke-linejoin','round');
    naG.appendChild(p);
  });
  naG.setAttribute('opacity','0'); svg.appendChild(naG);
  // 50m filled states: at zoom they REPLACE the coarse 110m US shape entirely,
  // giving a clean detailed coastline and crisp interior boundaries.
  var stateG=document.createElementNS(NS2,'g');
  var SFILL=['#3f6cc2','#3a64b6','#4472ca','#3d68bc'];
  US_STATES.forEach(function(d,i){
    var p=document.createElementNS(NS2,'path');
    p.setAttribute('d',d); p.setAttribute('fill',SFILL[i%4]);
    p.setAttribute('stroke','#0b1424'); p.setAttribute('stroke-width','0.7');
    p.setAttribute('stroke-linejoin','round');
    stateG.appendChild(p);
  });
  stateG.setAttribute('opacity','0'); svg.appendChild(stateG);
  // metro overlay in screen space (so labels stay crisp while the map scales)
  var citiesHost=document.getElementById('cities');
  var metros=US_METROS.map(function(c){
    var d=document.createElement('div'); d.className='city';
    d.innerHTML='<span class="dot"></span><span class="nm">'+c.n+'</span>';
    citiesHost.appendChild(d); return {el:d, x:c.x, y:c.y};
  });
  var c1=document.getElementById('c1'), c2=document.getElementById('c2'), c3=document.getElementById('c3');
  function E(p){p=Math.max(0,Math.min(1,p));return 1-Math.pow(1-p,3)}
  function fmt(n){return n.toLocaleString('en-US')}
  var OX=437, OY=315, MAPTOP=-100;
  window.__render=function(t){
    var zp=E((t-0.40)/2.6);
    var f=1+1.7*zp;
    var tx=-219.9*zp, ty=-647.5*zp;
    map.style.transform='translate('+tx.toFixed(1)+'px,'+ty.toFixed(1)+'px) scale('+(f/K).toFixed(5)+')';
    // world grays out as we commit to the US; USA brightens slightly
    cpaths.forEach(function(c){
      if(c.usa){ c.p.setAttribute('fill', mix(c.rgb,hex2rgb('#4a79d6'),zp*0.55)); }
      else { c.p.setAttribute('fill', mix(c.rgb,GRAY,zp*0.85)); }
    });
    // 50m detail (neighbor silhouettes + state boundaries) resolves mid-push
    var det=Math.max(0,Math.min(1,(zp-0.3)/0.35));
    naG.setAttribute('opacity', det);
    stateG.setAttribute('opacity', det);
    // metros land near the end, staggered
    metros.forEach(function(m,i){
      var sx=f*m.x-219.9*zp, sy=f*m.y-647.5*zp+MAPTOP;
      m.el.style.left=sx+'px'; m.el.style.top=sy+'px';
      var mp=E((t-(2.0+i*0.08))/0.3);
      m.el.style.opacity=mp*Math.max(0,Math.min(1,(zp-0.5)/0.3));
    });
    var cp=E((t-0.25)/1.4);
    c1.textContent=Math.round(200*cp)+'+';
    c2.textContent=fmt(Math.round(4454*cp));
    c3.textContent=fmt(Math.round(14262*cp));
  };
  window.__render(0);
})();
</script>
